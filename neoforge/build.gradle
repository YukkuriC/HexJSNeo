plugins {
    id 'com.github.johnrengelman.shadow'
}

loom {
    forge {
        mixinConfig "hexjsneo.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url "https://cursemaven.com" }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    modImplementation "curse.maven:curios-309927:6529130"
}

var fml_version = forge_version.split('-')[1]
fml_version = fml_version.substring(0, fml_version.indexOf("."))
processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand(
                version: project.version,
                mod_name: project.archives_name,
                modid: project.archives_name.toLowerCase(),
                mc_version: project.minecraft_version,
                minecraft_version: minecraft_version,
                fml_version: fml_version,
        )

    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}