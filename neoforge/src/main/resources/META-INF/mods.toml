modLoader = "javafml"
loaderVersion = "[0,)"
issueTrackerURL = "https://github.com/YukkuriC/${mod_name}/issues"
license = "MIT"

[[mods]]
modId = "${modid}"
version = "${version}"
displayName = "${mod_name}"
authors = "YukkuriC"
description = '''
Provides a way to create custom contents for Hex Casting via KubeJS.
'''
logoFile = "logo.png"
updateJSONURL = "https://api.modrinth.com/updates/${modid}/forge_updates.json"
displayURL = "https://modrinth.com/mod/${modid}"

[[dependencies.${modid}]]
modId = "minecraft"
mandatory = true
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${modid}]]
modId = "hexcasting"
mandatory = true
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${modid}]]
modId = "kubejs"
mandatory = true
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"