plugins {
    id 'dev.architectury.loom' version '1.13-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
    id "org.jetbrains.kotlin.jvm" version "2.2.21"
}

project.mod_version = "${minecraft_version}-${mod_version_base}"

// https://github.com/YukkuriC/YCLib-Minecraft/releases/
def jarFile = file("$projectDir/yclib/yclib-${yclib_version}.jar")
if (!jarFile.exists()) {
    def jarUrl = "https://github.com/YukkuriC/YCLib-Minecraft/releases/download/$yclib_version/yclib-${yclib_version}.jar"
    println "Downloading ${jarUrl} ..."
    jarFile.parentFile.mkdirs()
    try {
        new URL(jarUrl).withInputStream { inputStream ->
            jarFile.withOutputStream { outputStream ->
                outputStream << inputStream   // 写入文件
            }
        }
        println "Download completed: $jarFile"
    } catch (Exception e) {
        throw new GradleException("Failed to download ${jarUrl}", e)
    }
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'kotlin'
    apply plugin: 'maven-publish'

    loom {
        silentMojangMappingsLicense()
    }

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
        mavenLocal()
        maven { url "https://maven.blamejared.com/" }
        maven {
            url "https://cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }
        maven {
            name = 'Kotlin for Forge'
            url = 'https://thedarkcolour.github.io/KotlinForForge/'
        }
        flatDir { dir "../yclib" }
    }

    var nameForRef = project.name.equals("common") ? "fabric" : project.name
    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()

        compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))

        // modImplementation("at.petra-k.hexcasting:hexcasting-${nameForRef}-${project.minecraft_version}:${project.hexcastingVersion}") { transitive = false }

        // TODO update to 1.21
        // required dep
        implementation 'thedarkcolour:kotlinforforge:4.10.0'
        modImplementation "curse.maven:caelus-308989:5281700"
        modImplementation "curse.maven:inline-971167:6556850"
        modImplementation "curse.maven:patchouli-306770:6164575"
        modImplementation "curse.maven:cloth-config-348521:5729105"
        // interop dep
        modImplementation "curse.maven:hexparse-1148731:7676910"
        modImplementation "curse.maven:hexoverpowered-1173074:7733501"
        ["kubejs-238086:8715199", "rhino-416294:8463898", "probejs-585406:8304356"]
                .forEach { modImplementation("curse.maven:$it") }
        // helpers in runClient
        // modImplementation "curse.maven:jade-324717:6855440"
        modImplementation "curse.maven:just-enough-characters-250702:7411324"
        modImplementation "curse.maven:jei-238222:7270446"

        modImplementation fileTree(dir: "libs/$minecraft_version", include: '*.jar')
        modImplementation fileTree(dir: "../libs/$minecraft_version", include: '*.jar')
        implementation fileTree(dir: "libsRaw/$minecraft_version", include: '*.jar')
        implementation fileTree(dir: "../libsRaw/$minecraft_version", include: '*.jar')

        modImplementation "yclib:yclib:$yclib_version"
        if (project.name != 'common') include "yclib:yclib:$yclib_version"
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    compileKotlin {
        kotlinOptions {
            jvmTarget = "21"
        }
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}
